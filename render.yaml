# Déploiement sur Render : New > Blueprint, puis choisir ce dépôt GitHub.
services:
  - type: web
    name: pronos-top14
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
